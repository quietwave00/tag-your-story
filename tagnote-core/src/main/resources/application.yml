spring:
  profiles:
    include:
      - datasource
      - jpa
      - redis
      - security
      - api
      - sentry
      - tag

logging:
  level:
    root: info

# Single-instance SSE transport. Heartbeats use a dedicated scheduler.
notification:
  sse:
    timeout-ms: ${NOTIFICATION_SSE_TIMEOUT_MS:1800000}
    heartbeat-ms: ${NOTIFICATION_SSE_HEARTBEAT_MS:25000}
    per-user-limit: ${NOTIFICATION_SSE_PER_USER_LIMIT:5}

signup:
  code-secret: ${SIGNUP_CODE_SECRET:}
  mail:
    from: ${SMTP_FROM:}

spring.mail:
  host: ${SMTP_HOST:}
  port: ${SMTP_PORT:587}
  username: ${SMTP_USERNAME:}
  password: ${SMTP_PASSWORD:}
  properties:
    mail.smtp.auth: true
    mail.smtp.starttls.enable: true
    mail.smtp.starttls.required: true
    mail.smtp.connectiontimeout: 5000
    mail.smtp.timeout: 5000
    mail.smtp.writetimeout: 5000
