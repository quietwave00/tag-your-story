# kcube-rda-db : local PostgreSQL for the RDA customer (new project, independent of the old postgre14-rda)
name: ${KENV_RDA_DB_PROJECT:-kcube-rda-db}
services:
  postgres:
    image: postgres:14@sha256:922d38d4ca73ba5bfa8140c50b0d1f45636ca7b4c20d90506c49e2be2d7911f5
    container_name: ${KENV_RDA_DB_CONTAINER:-kcube-rda-pg}
    environment:
      POSTGRES_USER: rda
      POSTGRES_DB: rdadb
      POSTGRES_PASSWORD_FILE: /run/secrets/rda_pg_password
      # encoding UTF8 and locale en_US.utf8 are the image defaults and match the current DB.
      # timezone: the current server setting is Etc/UTC (image default) -> do not set TZ.
    secrets: [rda_pg_password]
    ports:
      - "127.0.0.1:${RDA_PG_PORT:-5432}:5432"
    volumes:
      - rda_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rda -d rdadb"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [default, kcube-dev]
    restart: "no"
volumes:
  rda_pgdata:
    name: ${KENV_RDA_VOLUME:-kcube_rda_pgdata}
networks:
  kcube-dev:
    external: true
    name: ${KENV_RDA_NETWORK:-kcube-dev}
secrets:
  rda_pg_password:
    file: ../../secrets/rda_pg_password.txt
